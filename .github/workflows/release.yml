# Release artifacts (M5.6) and the GitHub Release (SLI-35).
#
# Run it by hand with workflow_dispatch to prove a branch builds: that runs
# the build jobs, uploads their files as workflow artifacts and publishes
# nothing. A pushed `v*` tag runs the same build jobs, then `publish` creates
# the GitHub Release for the tag. One job per artifact, so each platform is
# added beside the others:
#   linux   - the tarball (packaging/linux/build-tarball.sh)        W2-1
#   macos   - the unsigned .dmg (packaging/macos/build-dmg.sh)      W2-3
#   nix     - `nix build` / `nix flake check` of flake.nix          W2-2
#             (a check, not a download: Nix users build from the flake)
#   publish - tag pushes only, after all three pass: checks the tag   SLI-35
#             against the crate version, then creates a published
#             Release with the tarball, the dmg and their .sha256 files,
#             its notes taken from the tag's CHANGELOG.md section
#             (packaging/release/prepare-release.sh)
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Two runs for the same ref never race to produce the same artifacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux tarball
    # The oldest supported runner, for the lowest glibc floor (2.35). The
    # floor actually shipped is read from the binary by build-tarball.sh and
    # written into the tarball's README and this job's summary.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system libraries
        # GPUI's build dependencies, the same list as ci.yml, plus Xvfb and
        # Mesa's software Vulkan driver for the launch smoke test.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev \
            libasound2-dev libzstd-dev pkg-config clang libssl-dev \
            xvfb xauth x11-utils mesa-vulkan-drivers

      - name: Install Rust
        # rustup reads rust-toolchain.toml (stable).
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Release builds only; don't share the CI jobs' debug cache.
          key: release

      - name: Build the tarball
        id: build
        env:
          # docs/install.md promises glibc 2.35; fail if the floor moves above it.
          ORRE_MAX_GLIBC: "2.35"
        run: |
          bash packaging/linux/build-tarball.sh | tee build.out
          echo "archive=$(tail -n1 build.out)" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        env:
          ARCHIVE: ${{ steps.build.outputs.archive }}
        run: bash packaging/linux/smoke-test.sh "$ARCHIVE"

      - name: Summary
        run: |
          {
            echo "### Linux tarball"
            echo
            echo '```'
            cat dist/*.sha256
            grep '^glibc floor' build.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: orre-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  macos:
    name: macOS dmg (unsigned)
    # arm64 only for v0.1. Unsigned: no Apple Developer account, so no
    # Developer ID, notarisation or Apple secrets; the app is ad-hoc signed
    # (packaging/macos/build-dmg.sh says why).
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the Metal compiler
        # GPUI compiles its shaders with `xcrun metal`; same step as ci.yml.
        run: |
          if ! xcrun -f metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -f metal

      - name: Install Rust
        # rustup reads rust-toolchain.toml (stable).
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release

      - name: Build the dmg
        id: build
        run: |
          bash packaging/macos/build-dmg.sh | tee build.out
          echo "dmg=$(tail -n1 build.out)" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        env:
          DMG: ${{ steps.build.outputs.dmg }}
        run: bash packaging/macos/smoke-test.sh "$DMG"

      - name: Summary
        run: |
          {
            echo "### macOS dmg (unsigned, ad-hoc signed)"
            echo
            echo "Not notarised: a downloaded copy needs the Gatekeeper steps in docs/install.md."
            echo
            echo '```'
            cat dist/*.sha256
            grep '^unsigned' build.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: orre-macos-arm64-unsigned
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error

  nix:
    name: Nix flake
    # Builds the flake's package (packaging/nix/package.nix) and runs its
    # check (`orre --help` without LD_LIBRARY_PATH). Nothing is uploaded:
    # Nix users build from the flake itself.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32

      - name: Build
        run: nix build -L

      - name: Check
        run: nix flake check -L

      - name: Run
        run: ./result/bin/orre --version

  publish:
    name: Publish GitHub Release
    # A pushed v* tag only. workflow_dispatch never publishes, even when it is
    # dispatched on a tag ref.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, nix]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that can write: creating a Release needs contents: write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gh uses GH_TOKEN; keep the contents: write token out of .git/config.
          persist-credentials: false

      - name: Check the tag and write the release notes
        id: prepare
        env:
          TAG: ${{ github.ref_name }}
          # rust-toolchain.toml would make rustup fetch its pinned components
          # before `cargo metadata` runs; the runner's preinstalled stable is
          # enough to read the manifest, so use it and download nothing.
          RUSTUP_TOOLCHAIN: stable
        run: bash packaging/release/prepare-release.sh "$TAG" "$RUNNER_TEMP/release-notes.md"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: orre-linux-x86_64
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: orre-macos-arm64-unsigned
          path: dist

      - name: Create the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          # Each pattern must match exactly one file, or nothing is created.
          shopt -s nullglob
          assets=()
          one() {
            local pattern=$1
            shift
            if [[ $# -ne 1 ]]; then
              echo "error: expected one $pattern, found $#" >&2
              exit 1
            fi
            assets+=("$1")
          }
          one 'dist/*.tar.gz' dist/*.tar.gz
          one 'dist/*.tar.gz.sha256' dist/*.tar.gz.sha256
          one 'dist/*.dmg' dist/*.dmg
          one 'dist/*.dmg.sha256' dist/*.dmg.sha256
          gh release create "$TAG" --verify-tag \
            --title "Orre $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${assets[@]}"
