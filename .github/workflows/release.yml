# Release artifacts (M5.6). Builds the v0.1 downloads and uploads them as
# workflow artifacts; it doesn't create a GitHub Release (W2-10 decides how
# the tag's artifacts are published).
#
# Run it by hand with workflow_dispatch to prove a branch builds; a pushed
# `v*` tag runs the same jobs. One job per artifact, so each platform is
# added beside the others:
#   linux  - the tarball (packaging/linux/build-tarball.sh)        W2-1
#   macos  - the unsigned .dmg (packaging/macos/build-dmg.sh)      W2-3
#   nix    - `nix build` / `nix flake check` of flake.nix          W2-2
#            (a check, not a download: Nix users build from the flake)
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Two runs for the same ref never race to produce the same artifacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux tarball
    # The oldest supported runner, for the lowest glibc floor (2.35). The
    # floor actually shipped is read from the binary by build-tarball.sh and
    # written into the tarball's README and this job's summary.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries
        # GPUI's build dependencies, the same list as ci.yml, plus Xvfb and
        # Mesa's software Vulkan driver for the launch smoke test.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev \
            libasound2-dev libzstd-dev pkg-config clang libssl-dev \
            xvfb xauth x11-utils mesa-vulkan-drivers

      - name: Install Rust
        # rustup reads rust-toolchain.toml (stable).
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          # Release builds only; don't share the CI jobs' debug cache.
          key: release

      - name: Build the tarball
        id: build
        env:
          # docs/install.md promises glibc 2.35; fail if the floor moves above it.
          ORRE_MAX_GLIBC: "2.35"
        run: |
          bash packaging/linux/build-tarball.sh | tee build.out
          echo "archive=$(tail -n1 build.out)" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        env:
          ARCHIVE: ${{ steps.build.outputs.archive }}
        run: bash packaging/linux/smoke-test.sh "$ARCHIVE"

      - name: Summary
        run: |
          {
            echo "### Linux tarball"
            echo
            echo '```'
            cat dist/*.sha256
            grep '^glibc floor' build.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: orre-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  macos:
    name: macOS dmg (unsigned)
    # arm64 only for v0.1. Unsigned: no Apple Developer account, so no
    # Developer ID, notarisation or Apple secrets; the app is ad-hoc signed
    # (packaging/macos/build-dmg.sh says why).
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Check the Metal compiler
        # GPUI compiles its shaders with `xcrun metal`; same step as ci.yml.
        run: |
          if ! xcrun -f metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -f metal

      - name: Install Rust
        # rustup reads rust-toolchain.toml (stable).
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Build the dmg
        id: build
        run: |
          bash packaging/macos/build-dmg.sh | tee build.out
          echo "dmg=$(tail -n1 build.out)" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        env:
          DMG: ${{ steps.build.outputs.dmg }}
        run: bash packaging/macos/smoke-test.sh "$DMG"

      - name: Summary
        run: |
          {
            echo "### macOS dmg (unsigned, ad-hoc signed)"
            echo
            echo "Not notarised: a downloaded copy needs the Gatekeeper steps in docs/install.md."
            echo
            echo '```'
            cat dist/*.sha256
            grep '^unsigned' build.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: orre-macos-arm64-unsigned
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error

  nix:
    name: Nix flake
    # Builds the flake's package (packaging/nix/package.nix) and runs its
    # check (`orre --help` without LD_LIBRARY_PATH). Nothing is uploaded:
    # Nix users build from the flake itself.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v32

      - name: Build
        run: nix build -L

      - name: Check
        run: nix flake check -L

      - name: Run
        run: ./result/bin/orre --version
